<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Leady</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffb703">
</head>

<body>
    <main class="hero">
        <section class="container">
            <div class="hero-card">
                <h1>Iniciar sesión</h1>
                <div class="mt-4">
                    <input type="email" id="login-email" class="form-control mb-3" placeholder="Correo electrónico">
                    <input type="password" id="login-password" class="form-control mb-3" placeholder="Contraseña">
                    <button class="btn-primary-leady w-100" onclick="loginUser()">Entrar</button>
                    <p id="login-status" class="api-status mt-3"></p>
                    <p class="auth-switch mt-3">
                        ¿No tenés cuenta?
                        <a href="register.html">Crear cuenta</a>
                    </p>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="js/auth.js"></script>
    <script src="js/navbar.js"></script>
</body>
</html>
