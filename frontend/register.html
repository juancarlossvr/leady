<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Leady</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffb703">
</head>

<body>
    <main class="hero">
        <section class="container">
            <div class="hero-card">
                <h1>Crear cuenta</h1>
                <div class="mt-4">
                    <input type="text" id="full_name" class="form-control mb-3" placeholder="Nombre completo">
                    <input type="text" id="username" class="form-control mb-3" placeholder="Usuario">
                    <input type="email" id="email" class="form-control mb-3" placeholder="Correo electrónico">
                    <input type="password" id="password" class="form-control mb-3" placeholder="Contraseña">
                    <div class="mb-3">
                        <label for="birth_date" class="form-label text-start w-100" style="font-size: 0.85rem; color: #ccc;">Fecha de nacimiento</label>
                        <input type="date" id="birth_date" class="form-control" required>
                    </div>
                    <button class="btn-primary-leady w-100" onclick="registerUser()">Registrarse</button>
                    <p id="register-status" class="api-status mt-3"></p>
                    <p class="auth-switch mt-3">
                        ¿Ya tenés cuenta?
                        <a href="login.html">Iniciar sesión</a>
                    </p>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="js/auth.js"></script>
    <script src="js/navbar.js"></script>
</body>
</html>
