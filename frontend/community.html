<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Plaza - Leady</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffb703">
    <script src="js/streaks.js"></script>
</head>

<body>
    <main class="container-xl py-4">

        <!-- CABECERA -->
        <section class="mb-4">
            <span class="badge-leady"><i class="bi bi-people-fill me-1"></i> Comunidad</span>
            <h1 class="mt-2 mb-1">La Plaza (Ñomongeta)</h1>
            <p class="text-secondary mb-0">Un espacio de ayuda mutua, consejos y experiencias entre jóvenes paraguayos.</p>
        </section>

        <div class="row g-4">
            <!-- FORMULARIO DE PUBLICACIÓN -->
            <div class="col-lg-4">
                <div class="detail-card position-sticky" style="top: 90px;">
                    <h3 class="mb-3" style="font-size: 1.3rem;"><i class="bi bi-pencil-square text-warning me-2"></i>Publicar tema</h3>
                    
                    <form onsubmit="createPost(event)">
                        <div class="mb-3">
                            <label class="form-label">Categoría</label>
                            <select id="post-category" class="form-control" required>
                                <option value="Duda">Tengo una duda</option>
                                <option value="Consejo">Consejo de postulación</option>
                                <option value="Experiencia">Mi experiencia</option>
                                <option value="General">General</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Título *</label>
                            <input type="text" id="post-title" class="form-control" placeholder="Ej: ¿Alguien aplicó al Rotary?" required maxLength="120">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Mensaje *</label>
                            <textarea id="post-content" class="form-control" rows="4" placeholder="Contá tu duda o experiencia con detalles..." required></textarea>
                        </div>

                        <button type="submit" id="btn-submit-post" class="btn-primary-leady w-100 py-2">
                            <i class="bi bi-send me-1"></i> Publicar en La Plaza
                        </button>
                        <p id="post-status" class="api-status mt-2"></p>
                    </form>
                </div>
            </div>

            <!-- FEED DE PUBLICACIONES -->
            <div class="col-lg-8">
                <!-- Filtros por categoría -->
                <div class="d-flex gap-2 mb-3 overflow-x-auto pb-2" id="category-filters">
                    <button class="btn-secondary-leady active py-1 px-3" style="font-size: 0.85rem;" onclick="filterCategory('all', this)">Todas</button>
                    <button class="btn-secondary-leady py-1 px-3" style="font-size: 0.85rem;" onclick="filterCategory('Duda', this)">Dudas</button>
                    <button class="btn-secondary-leady py-1 px-3" style="font-size: 0.85rem;" onclick="filterCategory('Consejo', this)">Consejos</button>
                    <button class="btn-secondary-leady py-1 px-3" style="font-size: 0.85rem;" onclick="filterCategory('Experiencia', this)">Experiencias</button>
                </div>

                <!-- Contenedor del Feed -->
                <div id="community-posts-container" class="d-flex flex-column gap-3">
                    <p class="text-secondary"><span class="spinner-border spinner-border-sm me-2" role="status"></span>Cargando publicaciones...</p>
                </div>
            </div>
        </div>

    </main>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="js/auth.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/community.js"></script>
    <script>
        protectPage().then(user => {
            if (user) loadPosts();
        });
    </script>
</body>
</html>
